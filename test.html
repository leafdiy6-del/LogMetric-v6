<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LogMetric — 体积公式单元测试</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace; background: #0f0f0f; color: #e0e0e0; padding: 24px; }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 6px; color: #fff; }
    .subtitle { font-size: 13px; color: #666; margin-bottom: 24px; }
    .summary { display: flex; gap: 20px; margin-bottom: 24px; padding: 16px; background: #1a1a1a; border-radius: 10px; }
    .summary-item { text-align: center; }
    .summary-item .num { font-size: 28px; font-weight: 700; }
    .summary-item .label { font-size: 12px; color: #888; margin-top: 2px; }
    .num.pass { color: #4caf50; }
    .num.fail { color: #f44336; }
    .num.total { color: #fff; }
    .section { margin-bottom: 20px; }
    .section-title { font-size: 13px; font-weight: 600; color: #aaa; text-transform: uppercase; letter-spacing: 0.08em; padding: 8px 0 6px; border-bottom: 1px solid #222; margin-bottom: 8px; }
    .test-row { display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px; border-radius: 6px; margin-bottom: 4px; font-size: 13px; }
    .test-row.pass { background: #0d1f0d; }
    .test-row.fail { background: #1f0d0d; }
    .badge { flex-shrink: 0; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; margin-top: 1px; }
    .badge.pass { background: #2e7d32; color: #a5d6a7; }
    .badge.fail { background: #b71c1c; color: #ffcdd2; }
    .test-name { flex: 1; color: #ccc; }
    .test-error { font-size: 12px; color: #ef9a9a; margin-top: 3px; font-family: monospace; }
    .warn-box { background: #1a1500; border: 1px solid #3d3000; border-radius: 8px; padding: 12px 14px; font-size: 12px; color: #ffc107; margin-bottom: 20px; line-height: 1.6; }
    .warn-box b { color: #ffd54f; }
  </style>
</head>
<body>

<h1>体积公式单元测试</h1>
<p class="subtitle">对 <code>js/modules/volume-calc.js</code> 中 4 种公式进行校验，改动公式后打开此页面确认结果。</p>

<div id="summary" class="summary">
  <div class="summary-item"><div class="num total" id="s-total">—</div><div class="label">总计</div></div>
  <div class="summary-item"><div class="num pass" id="s-pass">—</div><div class="label">通过</div></div>
  <div class="summary-item"><div class="num fail" id="s-fail">—</div><div class="label">失败</div></div>
</div>

<div id="output"></div>

<!-- ① Mock 全局变量（必须在加载生产代码之前） -->
<script>
  var appSettings = { formulaEnabled: false, formula: '' };
  var logs = [];
  var currentLang = 'zh';
  function save() {}
  function renderAll() {}
</script>

<!-- ② 加载生产代码 -->
<script src="js/data/slovakTable.js"></script>
<script src="js/modules/volume-calc.js"></script>

<!-- ③ 测试逻辑 -->
<script>
(function () {

  // ─── 工具函数 ───────────────────────────────────────────────────────────────

  const sections = {};
  let currentSection = '';

  function section(name) {
    currentSection = name;
    sections[name] = [];
  }

  function test(name, fn) {
    try {
      fn();
      sections[currentSection].push({ name, pass: true });
    } catch (e) {
      sections[currentSection].push({ name, pass: false, error: e.message });
    }
  }

  // 数值比较（允许浮点误差）
  function assertNear(actual, expected, tol, label) {
    if (isNaN(actual)) throw new Error((label || '') + ': 实际值为 NaN');
    if (Math.abs(actual - expected) > tol) {
      throw new Error((label || '') + ': 期望 ' + expected + '，实际 ' + actual.toFixed(8) + '，误差 ' + (actual - expected).toExponential(3));
    }
  }

  // 精确相等（用于已舍入的结果）
  function assertEqual(actual, expected, label) {
    if (actual !== expected) {
      throw new Error((label || '') + ': 期望 ' + expected + '，实际 ' + actual);
    }
  }

  // ─── 参考实现（独立计算，不依赖生产代码）────────────────────────────────────

  // 圆柱（默认公式）的参考实现
  function refCylinder(l, d) {
    return Math.PI * Math.pow(d / 200, 2) * l;
  }

  // 捷克 CSN 48 0009 的参考实现
  function refCzech(l, d) {
    const p0 = 1.2474, p1 = 0.042323, p2 = 1.0623;
    const bark = p0 + p1 * Math.pow(d, p2);
    const dNet = Math.max(0, d - bark);
    const area = (Math.PI / 4) * Math.pow(dNet / 100, 2);
    return Math.round(area * l * 100) / 100;
  }

  // ─── 测试：圆柱公式（默认）──────────────────────────────────────────────────

  section('圆柱公式（默认）');
  appSettings.formulaEnabled = false;

  [
    ['4',  '30'],
    ['5',  '40'],
    ['3',  '20'],
    ['10', '50'],
    ['6',  '35'],
    ['1',  '10'],
  ].forEach(([l, d]) => {
    test('长 ' + l + 'm × 径 ' + d + 'cm = ' + refCylinder(+l, +d).toFixed(5) + ' m³', () => {
      const v = calculateVolume(l, d);
      assertNear(v, refCylinder(+l, +d), 1e-9, '体积');
    });
  });

  test('无效输入 → 全部返回 0', () => {
    assertEqual(calculateVolume('', ''), 0, '空字符串');
    assertEqual(calculateVolume('0', '30'), 0, '长度为0');
    assertEqual(calculateVolume('4', '0'), 0, '直径为0');
    assertEqual(calculateVolume('-1', '30'), 0, '负数长度');
    assertEqual(calculateVolume('abc', 'xyz'), 0, '非数字');
  });

  test('逗号小数点兼容（斯洛伐尼亚格式）', () => {
    const v1 = calculateVolume('4', '30');
    const v2 = calculateVolume('4,0', '30,0');
    assertNear(v1, v2, 1e-9, '逗号 vs 点');
  });

  // ─── 测试：Huber 公式 ────────────────────────────────────────────────────────

  section('Huber 公式（EN 1309-2）');
  appSettings.formulaEnabled = true;
  appSettings.formula = 'huber';

  // Huber 与圆柱公式数学上等价，结果舍入到 3 位小数
  const huberCases = [
    ['4',  '30', 0.283],
    ['5',  '40', 0.628],
    ['3',  '20', 0.094],
    ['10', '50', 1.963],
    ['6',  '35', 0.577],
    ['1',  '10', 0.008],
  ];

  huberCases.forEach(([l, d, expected]) => {
    test('长 ' + l + 'm × 径 ' + d + 'cm = ' + expected + ' m³', () => {
      assertEqual(calculateVolume(l, d), expected, '体积');
    });
  });

  test('结果严格舍入到 3 位小数（非更多位数）', () => {
    huberCases.forEach(([l, d, expected]) => {
      const v = calculateVolume(l, d);
      const str = String(v);
      const decimals = str.includes('.') ? str.split('.')[1].length : 0;
      if (decimals > 3) throw new Error('长' + l + 'm 径' + d + 'cm: 小数位数 ' + decimals + ' > 3');
    });
  });

  test('无效输入 → 全部返回 0', () => {
    assertEqual(calculateVolume('', ''), 0, '空字符串');
    assertEqual(calculateVolume('abc', '30'), 0, '非数字');
    assertEqual(calculateVolume('0', '30'), 0, '长度为0');
  });

  // ─── 测试：捷克 ČSN 48 0009 公式 ────────────────────────────────────────────

  section('捷克 ČSN 48 0009 公式');
  appSettings.formula = 'csn480009';

  [
    ['4',  '30'],
    ['5',  '40'],
    ['3',  '20'],
    ['10', '50'],
    ['6',  '35'],
    ['8',  '45'],
  ].forEach(([l, d]) => {
    const expected = refCzech(+l, +d);
    test('长 ' + l + 'm × 径 ' + d + 'cm = ' + expected + ' m³（参考值）', () => {
      assertEqual(calculateVolume(l, d), expected, '体积');
    });
  });

  test('小直径（树皮修正后 dNet 应为正值）', () => {
    const v = calculateVolume('3', '10');
    if (v < 0) throw new Error('体积不应为负数：' + v);
  });

  test('csn4800079 别名与 csn480009 结果一致', () => {
    appSettings.formula = 'csn480009';
    const v1 = calculateVolume('5', '35');
    appSettings.formula = 'csn4800079';
    const v2 = calculateVolume('5', '35');
    assertNear(v1, v2, 1e-9, '两个别名');
    appSettings.formula = 'csn480009';
  });

  test('无效输入 → 全部返回 0', () => {
    assertEqual(calculateVolume('', ''), 0, '空字符串');
    assertEqual(calculateVolume('0', '30'), 0, '长度为0');
  });

  // ─── 测试：斯洛伐克查表法 ────────────────────────────────────────────────────

  section('斯洛伐克查表法（lookupIgor）');
  appSettings.formula = 'lookupIgor';

  if (!window.SLOVAK_TABLE || !window.SLOVAK_TABLE.table) {

    test('SLOVAK_TABLE 数据加载', () => {
      throw new Error('window.SLOVAK_TABLE 未定义，请检查 js/data/slovakTable.js 是否加载');
    });

  } else {

    const tbl = window.SLOVAK_TABLE;
    const lengths = tbl.lengths;
    const diameters = tbl.diameters;

    test('表数据结构完整（lengths / diameters / table 均存在）', () => {
      if (!Array.isArray(lengths) || lengths.length === 0) throw new Error('lengths 无效');
      if (!Array.isArray(diameters) || diameters.length === 0) throw new Error('diameters 无效');
      if (typeof tbl.table !== 'object') throw new Error('table 无效');
    });

    // 取中段的整数坐标做精确查表
    const midL = lengths[Math.floor(lengths.length / 2)];
    const midD = diameters[Math.floor(diameters.length / 2)];
    const tableVal = tbl.table[String(midL)] && tbl.table[String(midL)][String(midD)];

    test('整数坐标查表结果与原始表一致（长 ' + midL + 'm × 径 ' + midD + 'cm）', () => {
      if (tableVal == null) throw new Error('表中没有 L=' + midL + ' D=' + midD + ' 的数据');
      const v = calculateVolume(String(midL), String(midD));
      const expected = Math.round(tableVal * 100) / 100;
      assertEqual(v, expected, '体积');
    });

    // 插值结果必须在相邻整数之间
    const L1 = lengths[Math.floor(lengths.length / 2)];
    const L2 = lengths[Math.floor(lengths.length / 2) + 1];
    const D  = midD;

    test('插值结果在相邻整数值之间（长 ' + L1 + '~' + L2 + 'm）', () => {
      if (L2 == null) return; // 没有下一行，跳过
      const vLow  = tbl.table[String(L1)][String(D)];
      const vHigh = tbl.table[String(L2)][String(D)];
      if (vLow == null || vHigh == null) return;
      const midLen = (L1 + L2) / 2;
      const vInterp = calculateVolume(String(midLen), String(D));
      if (vInterp < Math.min(vLow, vHigh) - 0.01 || vInterp > Math.max(vLow, vHigh) + 0.01) {
        throw new Error('插值 ' + vInterp + ' 超出范围 [' + Math.min(vLow,vHigh) + ', ' + Math.max(vLow,vHigh) + ']');
      }
    });

    // 超出范围返回 0
    test('超出表格范围 → 返回 0', () => {
      assertEqual(calculateVolume('999', String(midD)), 0, '长度超范围');
      assertEqual(calculateVolume(String(midL), '999'), 0, '直径超范围');
    });

    // 单调性（抽取部分）
    test('单调性：同直径下，更长的原木体积更大', () => {
      const checkL1 = lengths[0];
      const checkL2 = lengths[lengths.length - 1];
      const checkD  = diameters[Math.floor(diameters.length / 2)];
      const v1 = tbl.table[String(checkL1)]?.[String(checkD)];
      const v2 = tbl.table[String(checkL2)]?.[String(checkD)];
      if (v1 == null || v2 == null) return;
      if (v1 >= v2) throw new Error('长' + checkL1 + 'm 体积 ' + v1 + ' ≥ 长' + checkL2 + 'm 体积 ' + v2);
    });

    test('单调性：同长度下，更粗的原木体积更大', () => {
      const checkL  = lengths[Math.floor(lengths.length / 2)];
      const checkD1 = diameters[0];
      const checkD2 = diameters[diameters.length - 1];
      const v1 = tbl.table[String(checkL)]?.[String(checkD1)];
      const v2 = tbl.table[String(checkL)]?.[String(checkD2)];
      if (v1 == null || v2 == null) return;
      if (v1 >= v2) throw new Error('径' + checkD1 + 'cm 体积 ' + v1 + ' ≥ 径' + checkD2 + 'cm 体积 ' + v2);
    });

  }

  // ─── 恢复默认设置 ────────────────────────────────────────────────────────────
  appSettings.formulaEnabled = false;
  appSettings.formula = '';

  // ─── 渲染结果 ────────────────────────────────────────────────────────────────

  let totalPass = 0, totalFail = 0;
  const output = document.getElementById('output');

  Object.entries(sections).forEach(([title, tests]) => {
    const passCount = tests.filter(t => t.pass).length;
    const failCount = tests.length - passCount;
    totalPass += passCount;
    totalFail += failCount;

    const sec = document.createElement('div');
    sec.className = 'section';

    const st = document.createElement('div');
    st.className = 'section-title';
    st.textContent = title + '  (' + passCount + '/' + tests.length + ')';
    sec.appendChild(st);

    tests.forEach(t => {
      const row = document.createElement('div');
      row.className = 'test-row ' + (t.pass ? 'pass' : 'fail');

      const badge = document.createElement('span');
      badge.className = 'badge ' + (t.pass ? 'pass' : 'fail');
      badge.textContent = t.pass ? 'PASS' : 'FAIL';

      const name = document.createElement('div');
      name.style.flex = '1';

      const nameText = document.createElement('div');
      nameText.className = 'test-name';
      nameText.textContent = t.name;
      name.appendChild(nameText);

      if (!t.pass && t.error) {
        const err = document.createElement('div');
        err.className = 'test-error';
        err.textContent = '✕ ' + t.error;
        name.appendChild(err);
      }

      row.appendChild(badge);
      row.appendChild(name);
      sec.appendChild(row);
    });

    output.appendChild(sec);
  });

  document.getElementById('s-total').textContent = totalPass + totalFail;
  document.getElementById('s-pass').textContent  = totalPass;
  document.getElementById('s-fail').textContent  = totalFail;

  if (totalFail === 0) {
    document.getElementById('s-fail').style.color = '#555';
  }

})();
</script>

</body>
</html>
